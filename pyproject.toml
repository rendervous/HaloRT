[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "halort"
version = "0.1.0"
description = "HaloRT / Denoiser / DenoiserX - minimal neural volumetric scattering models for real-time cloud rendering"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "numpy",
    "einops",
    "packaging",
]

[project.optional-dependencies]
notebooks = ["matplotlib", "pillow"]

[tool.setuptools.packages.find]
include = ["halort*"]

[tool.setuptools.package-data]
halort = ["*.h", "pretrained/*.pt", "sample_clouds/*.pt"]
